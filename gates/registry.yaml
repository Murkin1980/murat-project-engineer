version: 1.0.0
gates:
  - gate_id: clean_diff_scope
    type: deterministic
    hard: true
    applicable_when: repository files may change
    evidence_required: scoped changed-file list and diff review
    failure_state: REWORK
    retry_policy: correct once within approved scope
  - gate_id: secrets_scan
    type: deterministic
    hard: true
    applicable_when: files or artifacts are created or changed
    evidence_required: scan result without secret values
    failure_state: BLOCKED
    retry_policy: remove exposure and rescan; never print the secret
  - gate_id: build
    type: deterministic
    hard: true
    applicable_when: project defines a build command
    evidence_required: command and exit status
    failure_state: REWORK
    retry_policy: one bounded correction
  - gate_id: typecheck
    type: deterministic
    hard: true
    applicable_when: project defines static type checking
    evidence_required: command and exit status
    failure_state: REWORK
    retry_policy: one bounded correction
  - gate_id: lint
    type: deterministic
    hard: true
    applicable_when: project defines linting
    evidence_required: command and exit status
    failure_state: REWORK
    retry_policy: one bounded correction
  - gate_id: unit_tests
    type: deterministic
    hard: true
    applicable_when: unit tests exist or are required
    evidence_required: command, counts, and exit status
    failure_state: REWORK
    retry_policy: one bounded correction
  - gate_id: integration_tests
    type: deterministic
    hard: true
    applicable_when: component boundaries changed
    evidence_required: command, counts, and exit status
    failure_state: REWORK
    retry_policy: one bounded correction
  - gate_id: acceptance_tests
    type: deterministic
    hard: true
    applicable_when: acceptance criteria are machine-verifiable
    evidence_required: criterion-to-result mapping
    failure_state: REWORK
    retry_policy: one bounded correction
  - gate_id: artifact_exists
    type: deterministic
    hard: true
    applicable_when: the task promises a deliverable
    evidence_required: artifact path and size
    failure_state: BLOCKED
    retry_policy: create or restore the artifact
  - gate_id: artifact_hash
    type: deterministic
    hard: false
    applicable_when: integrity or transfer verification is required
    evidence_required: algorithm and digest
    failure_state: BLOCKED
    retry_policy: regenerate after confirming source
  - gate_id: rollback_available
    type: deterministic
    hard: true
    applicable_when: meaningful project state changes
    evidence_required: explicit rollback procedure
    failure_state: BLOCKED
    retry_policy: define rollback before continuing
  - gate_id: deep_change_check
    type: deterministic
    hard: true
    applicable_when: every run during classification and before finalization
    evidence_required: assessment against MASTER and core boundaries
    failure_state: HUMAN_REQUIRED
    retry_policy: detection cannot be overridden; a separate explicit human approval may authorize a later run
  - gate_id: task_packet_complete
    type: deterministic
    hard: true
    applicable_when: every bounded implementation or delegated task
    evidence_required: Task Packet with value, scope, deep-change, acceptance, verification, skillization, delegation, and rollback decisions
    failure_state: BLOCKED
    retry_policy: complete or narrow the packet before execution
  - gate_id: skillization_gate
    type: deterministic
    hard: true
    applicable_when: every bounded implementation or delegated task
    evidence_required: applicable skill reference and proof it was read, or explicit NO_APPLICABLE_SKILL reasoning
    failure_state: BLOCKED
    retry_policy: read the applicable skill or document why none applies
  - gate_id: browser_evidence
    type: deterministic
    hard: true
    applicable_when: one or more acceptance criteria are browser-observable
    evidence_required: Browser Evidence with exact environment, entry point, steps, observations, and artifact references
    failure_state: BLOCKED
    retry_policy: collect fresh evidence; inaccessible required browser surface cannot be passed
  - gate_id: verification_state_current
    type: deterministic
    hard: true
    applicable_when: technical or browser verification has completed
    evidence_required: Git-complete verification-state check returning VERIFIED for captured HEAD/base, changed-file statuses, staged/unstaged diffs, and changed-file contents
    failure_state: REWORK
    retry_policy: rerun affected checks and evidence, capture fresh state, then recheck
  - gate_id: final_git_diff_checkpoint
    type: deterministic
    hard: true
    applicable_when: a run is about to claim PASS after repository changes
    evidence_required: successful verification_state.py check --require-clean-scope --task-packet command for the final Git snapshot, plus rollback reference
    failure_state: REWORK
    retry_policy: correct scope/artifacts or re-enter verification after every mutation
  - gate_id: mailbox_schema_valid
    type: deterministic
    hard: true
    applicable_when: filesystem mailbox transport is used
    evidence_required: every envelope validates against MAILBOX_ENVELOPE and has a unique message_id
    failure_state: REWORK
    retry_policy: correct the envelope before delivery
  - gate_id: handoff_traceable
    type: deterministic
    hard: true
    applicable_when: a mailbox handoff is delivered
    evidence_required: run_id, task_id, sender_role, recipient_role, handoff_ref, and message_id
    failure_state: REWORK
    retry_policy: supply the missing trace reference
  - gate_id: event_log_valid
    type: deterministic
    hard: true
    applicable_when: runtime JSONL evidence is captured
    evidence_required: valid factual events in append order with allowed event types, explicit single-writer ownership, and a retention decision
    failure_state: REWORK
    retry_policy: reject the invalid event; do not rewrite prior events
  - gate_id: worktree_collision_check
    type: deterministic
    hard: true
    applicable_when: two or more writer roles may be active
    evidence_required: active writer role to resolved worktree ownership map
    failure_state: BLOCKED
    retry_policy: isolate writers in separate worktrees or execute sequentially
  - gate_id: terminal_state_valid
    type: deterministic
    hard: true
    applicable_when: ephemeral lifecycle metadata is used
    evidence_required: valid state and allowed transition; a terminal role requires a new invocation to restart
    failure_state: REWORK
    retry_policy: correct the transition or create an explicit new invocation
  - gate_id: compute_budget_preflight
    type: deterministic
    hard: false
    status: experimental
    applicable_when: substantial execution, deep-change work, large refactors, migrations, or large code-generation tasks
    evidence_required: deterministic preflight estimate with scope, estimated tasks, complexity, context size, model/tool calls, token range, provider mix, cost min/expected/max, recommended budget, hard limit, and forecast confidence
    failure_state: REWORK
    retry_policy: complete the preflight block before execution
  - gate_id: compute_budget_health
    type: deterministic
    hard: false
    status: experimental
    applicable_when: a compute budget snapshot with a hard limit and a projected total exists
    evidence_required: GREEN/YELLOW/ORANGE/RED/UNOBSERVED status derived from projected total vs hard limit
    failure_state: HUMAN_REQUIRED
    retry_policy: report the status; ORANGE or RED requires a separate explicit human budget decision
  - gate_id: compute_budget_burn_rate
    type: deterministic
    hard: false
    status: experimental
    applicable_when: observed usage and project progress both exist
    evidence_required: budget_consumed_percent, cost_per_progress_percent, and burn_rate_ratio with a BURN_RATE_ANOMALY flag on clear divergence
    failure_state: REWORK
    retry_policy: surface the anomaly in the run report and dashboard without blocking the run
