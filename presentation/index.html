<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f14" />
  <meta name="description" content="Интерактивная презентация Business Discovery и Murat Project Engineer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0f14'/%3E%3Cpath d='M15 42V22h6l11 13 11-13h6v20h-6V31L32 44 21 31v11z' fill='%23b9ed6f'/%3E%3C/svg%3E" />
  <title>MPE × Business Discovery</title>
  <style>
    :root {
      --ink: #f5f2e9;
      --muted: #a6afb7;
      --dim: #737d86;
      --bg: #0a0f14;
      --panel: rgba(21, 30, 38, 0.82);
      --line: rgba(211, 226, 236, 0.14);
      --line-strong: rgba(211, 226, 236, 0.28);
      --discovery: #b9ed6f;
      --discovery-soft: rgba(185, 237, 111, 0.11);
      --mpe: #71c7ff;
      --mpe-soft: rgba(113, 199, 255, 0.11);
      --signal: #ffb86b;
      --radius-lg: 30px;
      --radius-md: 20px;
      --header-h: 72px;
      --content: 1240px;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      max-width: 100%;
      overflow-x: clip;
    }

    body {
      margin: 0;
      min-width: 0;
      max-width: 100%;
      overflow-x: clip;
      background:
        radial-gradient(circle at 78% 10%, rgba(113, 199, 255, 0.09), transparent 31rem),
        radial-gradient(circle at 14% 42%, rgba(185, 237, 111, 0.055), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: Aptos, "Segoe UI Variable", "Trebuchet MS", sans-serif;
      line-height: 1.5;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.017) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.017) 1px, transparent 1px);
      background-size: 44px 44px;
      content: "";
      pointer-events: none;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button, a { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--ink);
      color: var(--bg);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .topbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 50;
      height: var(--header-h);
      border-bottom: 1px solid var(--line);
      background: rgba(10, 15, 20, 0.82);
      backdrop-filter: blur(20px) saturate(140%);
    }

    .topbar__inner {
      width: min(var(--content), calc(100% - 32px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      border: 0;
      padding: 6px;
      background: none;
      cursor: pointer;
      text-align: left;
    }

    .brand__mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: linear-gradient(145deg, var(--discovery-soft), var(--mpe-soft));
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand__copy { min-width: 0; }

    .brand__name {
      display: block;
      overflow: hidden;
      font-weight: 760;
      letter-spacing: -0.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand__chapter {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .menu-button,
    .lang-button,
    .icon-button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .menu-button:hover,
    .lang-button:hover,
    .icon-button:hover { border-color: var(--line-strong); }

    .menu-button:active,
    .lang-button:active,
    .icon-button:active { transform: scale(0.97); }

    .menu-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      font-weight: 700;
    }

    .menu-button__dots {
      width: 14px;
      height: 14px;
      display: grid;
      grid-template-columns: repeat(2, 4px);
      gap: 3px;
    }

    .menu-button__dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .language-switch {
      display: flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.025);
    }

    .lang-button {
      min-width: 44px;
      min-height: 44px;
      border: 0;
      padding: 0 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.06em;
    }

    .lang-button.is-active {
      background: var(--ink);
      color: var(--bg);
    }

    .top-progress {
      position: absolute;
      inset: auto 0 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.04);
    }

    .top-progress__bar {
      display: block;
      width: 12.5%;
      height: 100%;
      background: linear-gradient(90deg, var(--discovery), var(--mpe));
      transition: width 280ms ease;
    }

    .story-panel {
      position: relative;
      min-height: 100svh;
      display: grid;
      align-items: center;
      padding: calc(var(--header-h) + 54px) 0 112px;
      border-bottom: 1px solid var(--line);
      scroll-margin-top: var(--header-h);
      isolation: isolate;
    }

    .story-panel::after {
      position: absolute;
      right: clamp(16px, 4vw, 64px);
      bottom: 28px;
      z-index: -1;
      color: rgba(255, 255, 255, 0.035);
      content: attr(data-chapter);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(88px, 16vw, 210px);
      font-variant-numeric: lining-nums;
      line-height: 0.8;
      pointer-events: none;
    }

    .story-panel__inner {
      width: min(var(--content), calc(100% - 32px));
      margin: 0 auto;
    }

    .chapter-label {
      margin: 0 0 16px;
      color: var(--mpe);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .chapter-label--green { color: var(--discovery); }
    .chapter-label--warm { color: var(--signal); }

    h1, h2, h3, p { margin-top: 0; }

    h1,
    h2,
    .final-statement {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    h1 {
      max-width: 1040px;
      margin-bottom: 24px;
      font-size: clamp(44px, 7.1vw, 104px);
      line-height: 0.98;
    }

    h2 {
      max-width: 1010px;
      margin-bottom: 20px;
      font-size: clamp(38px, 5.1vw, 72px);
      line-height: 1.02;
    }

    .lead {
      max-width: 850px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 25px);
      line-height: 1.48;
      text-wrap: pretty;
    }

    .problem-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(340px, 0.88fr);
      gap: clamp(36px, 7vw, 98px);
      align-items: center;
    }

    .chaos-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.018);
    }

    .chaos-card {
      min-width: 0;
      min-height: 128px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    }

    .chaos-card:nth-child(2) { transform: translateY(10px) rotate(1.3deg); }
    .chaos-card:nth-child(3) { transform: rotate(-1.5deg); }
    .chaos-card:nth-child(6) { transform: translateY(-6px) rotate(1deg); }

    .chaos-card__tag {
      display: block;
      margin-bottom: 16px;
      color: var(--dim);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .chaos-card strong {
      display: block;
      font-size: clamp(15px, 1.5vw, 19px);
      line-height: 1.25;
      text-wrap: balance;
    }

    .takeaway {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      max-width: 850px;
      margin-top: 32px;
      padding-top: 22px;
      border-top: 1px solid var(--line-strong);
      color: var(--ink);
      font-size: clamp(17px, 1.6vw, 21px);
      font-weight: 700;
    }

    .takeaway__mark {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      margin-top: 9px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 7px rgba(255, 184, 107, 0.1);
    }

    .source-row,
    .benefit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 28px 0 34px;
    }

    .source-pill,
    .benefit-pill {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.02);
      color: #d4d9dc;
      font-size: 14px;
    }

    .source-pill::before,
    .benefit-pill::before {
      width: 6px;
      height: 6px;
      margin-right: 9px;
      border-radius: 50%;
      background: var(--discovery);
      content: "";
    }

    .benefit-pill::before { background: var(--mpe); }

    .linear-flow {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      counter-reset: flow;
    }

    .flow-node,
    .mpe-node {
      position: relative;
      min-width: 0;
      min-height: 120px;
      display: flex;
      align-items: flex-end;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel);
      color: var(--ink);
      font-weight: 760;
      line-height: 1.25;
    }

    .flow-node::before,
    .mpe-node::before {
      position: absolute;
      top: 16px;
      left: 18px;
      color: var(--discovery);
      content: "0" counter(flow);
      counter-increment: flow;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .flow-node:not(:last-child)::after,
    .mpe-node:not(:last-child)::after {
      position: absolute;
      top: 50%;
      right: -13px;
      z-index: 2;
      width: 13px;
      color: var(--dim);
      content: "→";
      font-weight: 400;
      transform: translateY(-50%);
    }

    .question-card {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: center;
      margin-top: 16px;
      padding: 20px 22px;
      border: 1px solid rgba(185, 237, 111, 0.35);
      border-radius: var(--radius-md);
      background: var(--discovery-soft);
    }

    .question-card--blue {
      border-color: rgba(113, 199, 255, 0.35);
      background: var(--mpe-soft);
    }

    .question-card span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .question-card strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 500;
      text-align: right;
    }

    .mpe-flow {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      margin-top: 34px;
      counter-reset: flow;
    }

    .mpe-node {
      min-height: 108px;
      padding: 16px;
      font-size: 14px;
    }

    .mpe-node::before { color: var(--mpe); }

    .interactive-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      margin-top: 34px;
      align-items: stretch;
    }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 9px;
      min-width: 0;
    }

    .pipeline-stage {
      position: relative;
      min-width: 0;
      min-height: 158px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      padding: 17px;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.022);
      cursor: pointer;
      text-align: left;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .pipeline-stage:not(:last-child)::after {
      position: absolute;
      right: -7px;
      bottom: 46px;
      z-index: 2;
      color: var(--dim);
      content: "↓";
      font-size: 16px;
    }

    .pipeline-stage:hover { transform: translateY(-4px); }

    .pipeline-stage.is-active {
      border-color: var(--stage-accent, var(--mpe));
      background: var(--stage-soft, var(--mpe-soft));
    }

    .pipeline-stage__num {
      color: var(--dim);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.1em;
    }

    .pipeline-stage__label {
      display: block;
      max-width: 100%;
      font-size: clamp(14px, 1.25vw, 17px);
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: break-word;
    }

    .pipeline-stage[data-tone="discovery"] {
      --stage-accent: var(--discovery);
      --stage-soft: var(--discovery-soft);
    }

    .pipeline-stage[data-tone="signal"] {
      --stage-accent: var(--signal);
      --stage-soft: rgba(255, 184, 107, 0.1);
    }

    .pipeline-detail {
      min-width: 0;
      min-height: 126px;
      display: flex;
      justify-content: flex-start;
      gap: clamp(24px, 5vw, 72px);
      align-items: center;
      padding: 25px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.018));
    }

    .pipeline-detail__label {
      flex: 0 0 auto;
      color: var(--dim);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .pipeline-detail p {
      max-width: 850px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 2.25vw, 31px);
      line-height: 1.25;
      text-wrap: balance;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 90px minmax(0, 1fr);
      gap: 18px;
      margin-top: 38px;
      align-items: stretch;
    }

    .compare-card {
      min-width: 0;
      padding: clamp(25px, 4vw, 42px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--panel);
    }

    .compare-card--discovery { border-top: 3px solid var(--discovery); }
    .compare-card--mpe { border-top: 3px solid var(--mpe); }

    .compare-card__name {
      margin-bottom: 32px;
      color: var(--discovery);
      font-size: 14px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .compare-card--mpe .compare-card__name { color: var(--mpe); }

    .compare-card h3 {
      margin-bottom: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 3vw, 40px);
      font-weight: 500;
      line-height: 1.1;
      text-wrap: balance;
    }

    .compare-card p {
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 17px;
    }

    .compare-question {
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .compare-question span {
      display: block;
      margin-bottom: 7px;
      color: var(--dim);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .compare-question strong { font-size: clamp(20px, 2vw, 27px); }

    .sequence-arrow {
      display: grid;
      place-items: center;
      color: var(--dim);
      font-size: 38px;
    }

    .sequence-note {
      max-width: 880px;
      margin: 20px auto 0;
      padding: 17px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.018);
      text-align: center;
      text-wrap: balance;
    }

    .sequence-note strong { color: var(--discovery); }
    .sequence-note b { color: var(--mpe); }

    .scenario-shell {
      display: grid;
      grid-template-columns: minmax(220px, 0.34fr) minmax(0, 1fr);
      gap: 18px;
      margin-top: 36px;
    }

    .scenario-nav {
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .scenario-tab {
      min-height: 68px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-align: left;
      transition: border-color 180ms ease, background 180ms ease;
    }

    .scenario-tab span:first-child {
      color: var(--dim);
      font-size: 12px;
      font-weight: 850;
    }

    .scenario-tab span:last-child {
      min-width: 0;
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .scenario-tab.is-active {
      border-color: var(--mpe);
      background: var(--mpe-soft);
    }

    .scenario-card {
      min-width: 0;
      min-height: 386px;
      padding: clamp(26px, 4.5vw, 48px);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, rgba(113, 199, 255, 0.07), rgba(185, 237, 111, 0.025));
    }

    .scenario-card__role {
      display: block;
      margin-bottom: 22px;
      color: var(--mpe);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .scenario-card h3 {
      max-width: 780px;
      margin-bottom: 23px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 3.2vw, 44px);
      font-weight: 500;
      line-height: 1.13;
      text-wrap: balance;
    }

    .scenario-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .scenario-list li {
      position: relative;
      min-width: 0;
      padding: 14px 14px 14px 37px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.12);
      color: #d6dce0;
    }

    .scenario-list li::before {
      position: absolute;
      top: 18px;
      left: 16px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--discovery);
      content: "";
    }

    .scenario-verdict {
      margin-top: 20px;
      padding: 16px 18px;
      border-left: 3px solid var(--signal);
      background: rgba(255, 184, 107, 0.07);
      font-weight: 780;
    }

    .scenario-outcome {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .scenario-outcome span {
      position: relative;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .scenario-outcome span:not(:last-child)::after {
      position: absolute;
      top: 50%;
      right: -8px;
      z-index: 2;
      color: var(--dim);
      content: "→";
      transform: translateY(-50%);
    }

    .value-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 11px;
      margin-top: 38px;
    }

    .value-card {
      min-width: 0;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--panel);
    }

    .value-card__num {
      color: var(--mpe);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
    }

    .value-card h3 {
      margin-bottom: 10px;

      align-items: center;
      margin: 48px auto 0;

      padding: 15px;

    .final-note {

      margin: 25px auto 0;
      color: var(--muted);
      font-size: 17px;

    .story-controls {

      right: 50%;

      padding: 8px;

      transform: translateX(50%);

    .control-button {
      min-width: 0;
      min-height: 48px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      font-weight: 760;
    }

    .control-button--next {
      border-color: transparent;
      background: var(--ink);
      color: var(--bg);

    .control-status {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: center;
    }

    .control-status__count {
      color: var(--dim);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.12em;
    }

    .control-status__title {
      max-width: 100%;
      overflow: hidden;
      font-size: 13px;
      font-weight: 740;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      border: 0;
      background: rgba(0, 0, 0, 0.56);
      cursor: default;
      opacity: 0;
      transition: opacity 220ms ease;
    }

    .chapter-drawer {
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 80;
      width: min(430px, calc(100% - 24px));
      display: flex;
      flex-direction: column;
      padding: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 28px;
      background: #111820;
      box-shadow: 0 32px 100px rgba(0, 0, 0, 0.48);
      transform: translateX(calc(100% + 32px));
      transition: transform 220ms ease;
    }

    .drawer-backdrop.is-open { opacity: 1; }
    .chapter-drawer.is-open { transform: translateX(0); }

    .drawer__header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin-bottom: 14px;
      padding: 4px 4px 14px 8px;
      border-bottom: 1px solid var(--line);
    }

    .drawer__header strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 500;
    }

    .icon-button {
      width: 44px;
      flex: 0 0 auto;
      padding: 0;
      font-size: 22px;
    }

    .drawer__nav {
      min-height: 0;
      display: grid;
      gap: 7px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .drawer-link {
      min-height: 58px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 15px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .drawer-link:hover { background: rgba(255, 255, 255, 0.03); }

    .drawer-link.is-active {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.045);
    }

    .drawer-link__num {
      color: var(--dim);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .drawer-link__name {
      min-width: 0;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .page-footer {
      padding: 28px 16px 120px;
      color: var(--dim);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1100px) {
      .problem-layout { grid-template-columns: 1fr; }
      .chaos-board { max-width: 760px; }
      .mpe-flow { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .mpe-node:nth-child(4)::after { display: none; }
      .pipeline { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .pipeline-stage { min-height: 138px; }
      .pipeline-stage:nth-child(4)::after { display: none; }
      .pipeline-detail { min-height: 126px; }
      .value-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 780px) {
      :root { --header-h: 64px; }

      .topbar__inner,
      .story-panel__inner { width: min(100% - 24px, var(--content)); }

      .brand__name { font-size: 14px; }
      .brand__chapter { display: none; }
      .menu-button__label { display: none; }
      .menu-button { width: 44px; justify-content: center; padding: 0; }

      .story-panel {
        min-height: 100svh;
        padding: calc(var(--header-h) + 44px) 0 118px;
      }

      .linear-flow,
      .mpe-flow,
      .pipeline { grid-template-columns: 1fr; }

      .flow-node,
      .mpe-node {
        min-height: 76px;
        padding: 18px 18px 18px 65px;
        align-items: center;
      }

      .flow-node::before,
      .mpe-node::before {
        top: 50%;
        transform: translateY(-50%);
      }

      .flow-node:not(:last-child)::after,
      .mpe-node:not(:last-child)::after {
        top: auto;
        right: 50%;
        bottom: -18px;
        width: auto;
        content: "↓";
        transform: translateX(50%);
      }

      .mpe-node:nth-child(4)::after { display: block; }

      .question-card { align-items: flex-start; flex-direction: column; }
      .question-card strong { text-align: left; }

      .pipeline-stage {
        min-height: 72px;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 17px;
        padding: 15px 17px;
      }

      .pipeline-stage:not(:last-child)::after {
        right: 50%;
        bottom: -15px;
        transform: translateX(50%);
      }

      .pipeline-stage__num { flex: 0 0 26px; }
      .pipeline-stage:nth-child(4)::after { display: block; }
      .pipeline-detail { align-items: flex-start; flex-direction: column; gap: 0; }
      .pipeline-detail p { margin-top: 20px; }

      .compare-grid { grid-template-columns: 1fr; }
      .sequence-arrow { min-height: 34px; transform: rotate(90deg); }
      .sequence-note { border-radius: var(--radius-md); }

      .scenario-shell { grid-template-columns: 1fr; }
      .scenario-nav { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .scenario-tab {
        min-height: 62px;
        grid-template-columns: 1fr;
        gap: 2px;
        padding: 9px;
        text-align: center;
      }
      .scenario-tab span:last-child { font-size: 12px; line-height: 1.2; }
      .scenario-card { min-height: 420px; }
      .scenario-list { grid-template-columns: 1fr; }
      .scenario-outcome { grid-template-columns: 1fr 1fr; }
      .scenario-outcome span:nth-child(2)::after { display: none; }

      .value-grid { grid-template-columns: 1fr 1fr; }
      .value-card { min-height: 210px; }

      .final-chain { grid-template-columns: 1fr; max-width: 520px; }
      .final-chain__arrow { transform: rotate(90deg); }
    }

    @media (max-width: 520px) {
      .brand__copy { display: none; }
      .topbar__actions { gap: 6px; }

      h1 { font-size: clamp(40px, 12.5vw, 58px); }
      h2 { font-size: clamp(36px, 10.4vw, 48px); }

      .chaos-board { padding: 10px; gap: 7px; }
      .chaos-card { min-height: 112px; padding: 13px; }
      .chaos-card__tag { margin-bottom: 11px; }

      .value-grid { grid-template-columns: 1fr; }
      .value-card { min-height: 180px; }

      .scenario-nav { grid-template-columns: 1fr 1fr; }
      .scenario-card { min-height: 460px; padding: 24px 20px; }
      .scenario-outcome { grid-template-columns: 1fr; }
      .scenario-outcome span:not(:last-child)::after {
        top: auto;
        right: 50%;
        bottom: -14px;
        content: "↓";
        transform: translateX(50%);
      }
      .scenario-outcome span:nth-child(2)::after { display: block; }

      .story-controls { grid-template-columns: 52px minmax(0, 1fr) 52px; min-height: 62px; }
      .control-button { padding: 0; }
      .control-button__label { display: none; }
      .control-status__title { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

    const state = {
      lang: localStorage.getItem('mpe-presentation-lang') === 'kz' ? 'kz' : 'ru',
      section: 0,
      pipeline: 0,
      scenario: 0,
      drawerOpen: false
    };

    const panels = [...document.querySelectorAll('[data-section]')];
    const getCopy = () => CONTENT[state.lang];

    function getByPath(source, path) { return path.split('.').reduce((value, key) => value?.[key], source); }

    function escapeHtml(value) {
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function renderStaticCopy() {
      const copy = getCopy();
      document.documentElement.lang = state.lang;
      document.title = copy.meta.title;
      document.querySelector('meta[name="description"]').content = copy.meta.description;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const value = getByPath(copy, element.dataset.i18n);
        if (typeof value === 'string') element.textContent = value;
      });
      document.getElementById('menuButton').ariaLabel = copy.ui.menuLabel;
      document.getElementById('brandButton').ariaLabel = copy.ui.brand;
      document.getElementById('closeDrawerButton').ariaLabel = copy.ui.close;
      document.getElementById('drawerBackdrop').ariaLabel = copy.ui.close;
      document.getElementById('chapterDrawer').ariaLabel = copy.ui.sections;
      document.getElementById('languageSwitch').ariaLabel = copy.ui.languageLabel;
      document.getElementById('storyControls').ariaLabel = copy.ui.navigationLabel;
      document.querySelectorAll('[data-lang]').forEach((button) => {
        const active = button.dataset.lang === state.lang;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function renderProblem() {
      document.getElementById('chaosBoard').innerHTML = getCopy().problem.cards.map((card) => `
        <article class="chaos-card"><span class="chaos-card__tag">${escapeHtml(card.tag)}</span><strong>${escapeHtml(card.text)}</strong></article>
      `).join('');
    }

    function renderDiscovery() {
      const copy = getCopy().discovery;
      document.getElementById('discoverySources').innerHTML = copy.sources.map((item) => `<span class="source-pill">${escapeHtml(item)}</span>`).join('');
      document.getElementById('discoveryFlow').innerHTML = copy.flow.map((item) => `<div class="flow-node">${escapeHtml(item)}</div>`).join('');
    }

    function renderMpe() {
      const copy = getCopy().mpe;
      document.getElementById('mpeFlow').innerHTML = copy.flow.map((item) => `<div class="mpe-node">${escapeHtml(item)}</div>`).join('');
      document.getElementById('mpeBenefits').innerHTML = copy.benefits.map((item) => `<span class="benefit-pill">${escapeHtml(item)}</span>`).join('');
    }

    function selectPipeline(index, moveFocus = false) {
      const stages = getCopy().pipeline.stages;
      state.pipeline = Math.max(0, Math.min(index, stages.length - 1));
      const buttons = [...document.querySelectorAll('.pipeline-stage')];
      buttons.forEach((button, buttonIndex) => {
        const active = buttonIndex === state.pipeline;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      document.getElementById('pipelineDetail').textContent = stages[state.pipeline].detail;
      if (moveFocus) buttons[state.pipeline]?.focus({ preventScroll: true });
    }

    function renderPipeline() {
      const stages = getCopy().pipeline.stages;
      const container = document.getElementById('pipelineStages');
      container.innerHTML = stages.map((stage, index) => `
        <button class="pipeline-stage" type="button" data-pipeline-index="${index}" data-tone="${escapeHtml(stage.tone)}" aria-pressed="false">
          <span class="pipeline-stage__num">${String(index + 1).padStart(2, '0')}</span><span class="pipeline-stage__label">${escapeHtml(stage.label)}</span>
        </button>
      `).join('');
      container.querySelectorAll('[data-pipeline-index]').forEach((button) => {
        button.addEventListener('click', () => selectPipeline(Number(button.dataset.pipelineIndex)));
        button.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
          event.preventDefault();
          const direction = ['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : -1;
          selectPipeline((state.pipeline + direction + stages.length) % stages.length, true);
        });
      });
      selectPipeline(state.pipeline);
    }

    function renderComparison() { document.getElementById('sequenceNote').innerHTML = getCopy().comparison.sequence; }

    function selectScenario(index, moveFocus = false) {
      const steps = getCopy().scenario.steps;
      state.scenario = Math.max(0, Math.min(index, steps.length - 1));
      const step = steps[state.scenario];
      const tabs = [...document.querySelectorAll('.scenario-tab')];
      tabs.forEach((tab, tabIndex) => {
        const active = tabIndex === state.scenario;
        tab.classList.toggle('is-active', active);
        tab.setAttribute('aria-pressed', String(active));
      });
      document.getElementById('scenarioRole').textContent = step.role;
      document.getElementById('scenarioHeadline').textContent = step.headline;
      document.getElementById('scenarioList').innerHTML = step.items.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
      const verdict = document.getElementById('scenarioVerdict');
      verdict.hidden = !step.verdict;
      verdict.textContent = step.verdict || '';
      const outcome = document.getElementById('scenarioOutcome');
      outcome.hidden = !step.outcome;
      outcome.innerHTML = (step.outcome || []).map((item) => `<span>${escapeHtml(item)}</span>`).join('');
      if (moveFocus) tabs[state.scenario]?.focus({ preventScroll: true });
    }

        <button class="scenario-tab" type="button" data-scenario-index="${index}" aria-pressed="false"><span>${String(index + 1).padStart(2, '0')}</span><span>${escapeHtml(label)}</span></button>
      `).join('');
      container.querySelectorAll('[data-scenario-index]').forEach((button) => {
        button.addEventListener('click', () => selectScenario(Number(button.dataset.scenarioIndex)));
        button.addEventListener('keydown', (event) => {
          if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
          event.preventDefault();
          const direction = ['ArrowRight', 'ArrowDown'].includes(event.key) ? 1 : -1;
          selectScenario((state.scenario + direction + copy.steps.length) % copy.steps.length, true);
        });
      });
      selectScenario(state.scenario);
    }

    function renderValue() {
      document.getElementById('valueGrid').innerHTML = getCopy().value.items.map((item, index) => `
        <article class="value-card"><span class="value-card__num">${String(index + 1).padStart(2, '0')}</span><div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.text)}</p></div></article>
      `).join('');
    }

    function renderFinal() {
      document.getElementById('finalChain').innerHTML = getCopy().final.chain.map((item, index, items) => `
        <span>${escapeHtml(item)}</span>${index < items.length - 1 ? '<span class="final-chain__arrow" aria-hidden="true">→</span>' : ''}
      `).join('');
    }

    function renderDrawer() {
      const copy = getCopy();
      const nav = document.getElementById('drawerNav');
      nav.innerHTML = copy.nav.map((label, index) => `
        <button class="drawer-link" type="button" data-go-to="${index}"><span class="drawer-link__num">${String(index + 1).padStart(2, '0')}</span><span class="drawer-link__name">${escapeHtml(label)}</span></button>
      `).join('');
      nav.querySelectorAll('[data-go-to]').forEach((button) => {
        button.addEventListener('click', () => { closeDrawer(); goToSection(Number(button.dataset.goTo)); });
      });
    }

    function renderLanguage() {
      renderStaticCopy(); renderProblem(); renderDiscovery(); renderMpe(); renderPipeline(); renderComparison();
      renderScenario(); renderValue(); renderFinal(); renderDrawer(); updateNavigation();
    }

    function setLanguage(language) {
      if (!CONTENT[language]) return;
      state.lang = language;
      localStorage.setItem('mpe-presentation-lang', language);
      renderLanguage();
    }

    function updateNavigation() {
      const copy = getCopy();
      const current = state.section + 1;
      const total = panels.length;
      document.getElementById('progressBar').style.width = `${(current / total) * 100}%`;
      document.getElementById('sectionCount').textContent = copy.ui.counter(current, total);
      document.getElementById('sectionTitle').textContent = copy.nav[state.section];
      document.getElementById('brandChapter').textContent = copy.nav[state.section];
      document.getElementById('previousButton').disabled = state.section === 0;
      document.getElementById('nextButton').disabled = state.section === total - 1;
      document.querySelectorAll('.drawer-link').forEach((link, index) => {
        const active = index === state.section;
        link.classList.toggle('is-active', active);
        if (active) link.setAttribute('aria-current', 'step'); else link.removeAttribute('aria-current');
      });
    }

    function goToSection(index) {
      const target = Math.max(0, Math.min(index, panels.length - 1));
      panels[target].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function openDrawer() {
      if (state.drawerOpen) return;
      state.drawerOpen = true;
      const drawer = document.getElementById('chapterDrawer');
      const backdrop = document.getElementById('drawerBackdrop');
      drawer.hidden = false;
      backdrop.hidden = false;
      document.getElementById('menuButton').setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => {
        drawer.classList.add('is-open'); backdrop.classList.add('is-open'); document.getElementById('closeDrawerButton').focus();
      });
    }

    function closeDrawer() {
      if (!state.drawerOpen) return;
      state.drawerOpen = false;
      const drawer = document.getElementById('chapterDrawer');
      const backdrop = document.getElementById('drawerBackdrop');
      drawer.classList.remove('is-open'); backdrop.classList.remove('is-open');
      document.getElementById('menuButton').setAttribute('aria-expanded', 'false');
      window.setTimeout(() => { drawer.hidden = true; backdrop.hidden = true; }, 230);
    }

    let scrollFrame = 0;
    function syncSectionFromScroll() {
      cancelAnimationFrame(scrollFrame);
      scrollFrame = requestAnimationFrame(() => {
        const viewportTarget = window.innerHeight * 0.48;
        let nearest = 0;
        let distance = Number.POSITIVE_INFINITY;
        panels.forEach((panel, index) => {
          const rect = panel.getBoundingClientRect();
          const panelTarget = rect.top + Math.min(rect.height, window.innerHeight) * 0.5;
          const candidate = Math.abs(panelTarget - viewportTarget);
          if (candidate < distance) { distance = candidate; nearest = index; }
        });
        if (nearest !== state.section) { state.section = nearest; updateNavigation(); }
      });
    }

    document.getElementById('menuButton').addEventListener('click', openDrawer);
    document.getElementById('statusButton').addEventListener('click', openDrawer);
    document.getElementById('closeDrawerButton').addEventListener('click', closeDrawer);
    document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
    document.getElementById('brandButton').addEventListener('click', () => goToSection(0));
    document.getElementById('previousButton').addEventListener('click', () => goToSection(state.section - 1));
    document.getElementById('nextButton').addEventListener('click', () => goToSection(state.section + 1));
    document.querySelectorAll('[data-lang]').forEach((button) => button.addEventListener('click', () => setLanguage(button.dataset.lang)));
    window.addEventListener('scroll', syncSectionFromScroll, { passive: true });
    window.addEventListener('resize', syncSectionFromScroll, { passive: true });
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.drawerOpen) { closeDrawer(); document.getElementById('menuButton').focus(); return; }
      if (state.drawerOpen || event.target.closest('button, a, input, textarea, select')) return;
      if (['ArrowRight', 'PageDown'].includes(event.key)) { event.preventDefault(); goToSection(state.section + 1); }
      if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); goToSection(state.section - 1); }
    });

    renderLanguage();
    syncSectionFromScroll();
  </script>
</body>
</html>
