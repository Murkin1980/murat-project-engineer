<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">MPE light mark</title>
<desc id="desc">Three ascending pseudo-3D blocks carrying M, P and E.</desc>
<defs>
  <linearGradient id="mFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dce6f2"/>
  </linearGradient>
  <linearGradient id="mSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dce6f2"/>
    <stop offset="1" stop-color="#b9c7d8"/>
  </linearGradient>
  <linearGradient id="pFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#75b8ff"/>
    <stop offset="1" stop-color="#2f75d6"/>
  </linearGradient>
  <linearGradient id="pSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4f9df1"/>
    <stop offset="1" stop-color="#2358a7"/>
  </linearGradient>
  <linearGradient id="eFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1ea7ff"/>
    <stop offset="1" stop-color="#173bd5"/>
  </linearGradient>
  <linearGradient id="eSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1476f2"/>
    <stop offset="1" stop-color="#102c9d"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#07152a" flood-opacity=".18"/>
  </filter>
</defs>
<rect width="512" height="512" rx="92" fill="#ffffff"/>
<g filter="url(#shadow)">
  <!-- M -->
  <polygon points="76,322 156,282 232,321 151,362" fill="#f8fbff"/>
  <polygon points="151,362 232,321 232,419 151,460" fill="url(#mSide)"/>
  <polygon points="76,322 151,362 151,460 76,420" fill="url(#mFront)"/>
  <!-- P -->
  <polygon points="180,240 266,197 348,238 261,281" fill="#9ccfff"/>
  <polygon points="261,281 348,238 348,395 261,438" fill="url(#pSide)"/>
  <polygon points="180,240 261,281 261,438 180,398" fill="url(#pFront)"/>
  <!-- E -->
  <polygon points="291,147 382,102 468,145 377,190" fill="#24b2ff"/>
  <polygon points="377,190 468,145 468,357 377,402" fill="url(#eSide)"/>
  <polygon points="291,147 377,190 377,402 291,359" fill="url(#eFront)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="72" text-anchor="middle">
  <text x="116" y="413" fill="#071525">M</text>
  <text x="221" y="354" fill="#ffffff">P</text>
  <text x="334" y="302" fill="#ffffff">E</text>
</g>
</svg>