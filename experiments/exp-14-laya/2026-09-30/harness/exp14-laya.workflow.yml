# EXP-14 Sequence B harness — TEMPORARY experiment runner.
#
# This workflow exists only to execute EXP-14 Sequence B (Laya zero-shot) on a
# host that can reach the pinned checkpoint. The authoring agent sandbox has an
# allow-listed network egress: every huggingface.co / hf.co / xethub zone fails
# the TLS handshake, so the pinned 843 MB checkpoint cannot be retrieved there.
# The probe that establishes this is recorded at
# experiments/exp-14-laya/2026-09-30/raw/laya_access_probe_sandbox.json.
#
# This is the same bounded pattern EXP-18 used and documented
# (experiments/exp-18-pirateface-model-resilience/METHOD.md): a temporary,
# credential-free, ephemeral GitHub-hosted runner that is destroyed at the end
# of the job, publishes nothing, deploys nothing, and is never merged to main.
# The workflow file is removed once the evidence is recorded.
#
# It changes no production routing, no Router authority, no MPE decision rule
# and no autonomy setting. It only reads the frozen dataset and writes evidence
# under experiments/exp-14-laya/.
#
# workflow_dispatch requires the file on the default branch, so the harness is
# triggered by pushes that touch it. It is never merged to main.
name: EXP-14 Sequence B harness (temporary)

on:
  push:
    branches:
      - arena/01a0f3b0-murat-project-engineer
    paths:
      - 'experiments/exp-14-laya/**'
      - '.github/workflows/exp14-laya-harness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exp14-sequence-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sequence-b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pinned Laya stack (ephemeral runner tooling, not a repository dependency)
        working-directory: experiments/exp-14-laya/2026-09-30
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # CPU-only torch: the runner has no GPU and the experiment pins device=cpu.
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu \
            || pip install --no-cache-dir torch
          pip install --no-cache-dir "laya==0.3.22"
          python - <<'PY'
          import laya, torch, transformers, huggingface_hub
          from laya.revisions import PINNED_REVISIONS
          print("laya", laya.__version__)
          print("torch", torch.__version__, "cuda", torch.cuda.is_available())
          print("transformers", transformers.__version__)
          print("huggingface_hub", huggingface_hub.__version__)
          print("PINNED_REVISIONS", PINNED_REVISIONS)
          PY

      - name: Run EXP-14 Sequence B
        working-directory: experiments/exp-14-laya/2026-09-30
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          OMP_NUM_THREADS: '4'
        run: bash harness/run_sequence_b.sh 3 "root typed-decisions"

      - name: Print key evidence to the job log
        if: always()
        working-directory: experiments/exp-14-laya/2026-09-30
        run: |
          for f in raw/sequence_b_console.log raw/laya_access_probe_execution_host.json \
                   raw/metrics_*.json raw/laya_*_reproducibility.json; do
            for match in $f; do
              echo "===== $match ====="
              head -c 20000 "$match" 2>/dev/null || echo "(missing)"
              echo
            done
          done

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp14-sequence-b-evidence
          path: experiments/exp-14-laya/2026-09-30/raw/**
          if-no-files-found: warn
          retention-days: 14

      # The authoring sandbox can reach github.com but not the Actions artifact
      # CDN (objects.githubusercontent.com fails TLS), so the evidence is also
      # committed straight back to the experiment branch — the EXP-18 pattern.
      - name: Commit evidence back to the experiment branch
        if: always()
        working-directory: experiments/exp-14-laya/2026-09-30
        run: |
          set -e
          test -d raw || { echo "no raw directory"; exit 0; }
          git config user.name "exp14-harness"
          git config user.email "exp14-harness@users.noreply.github.com"
          git add -f raw
          if git diff --cached --quiet; then echo "no evidence changes to commit"; exit 0; fi
          git commit -m "EXP-14: Sequence B evidence (run ${GITHUB_RUN_ID})"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then echo "evidence pushed"; exit 0; fi
            sleep 5
          done
          echo "evidence push failed after retries"; exit 1
